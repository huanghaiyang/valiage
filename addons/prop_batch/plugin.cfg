[plugin]

name="合批选择器 (Prop Batch Picker)"
description="把「是否允许合批 / 参与合批」两个开关加到节点自己的检查器里：\n① 模型根节点（有多个子件时）：「是否允许合批」→ meta allow_batch = true（默认不勾）\n② 子网格（根允许后）：「参与合批」→ meta batch = false 表示排除（默认参与）\n不写任何配置文件、不加面板；meta 存在 .tscn 里（记忎 Ctrl+S 保存场景）。\n运行时 scripts/world/prop_merge.gd 读这两个 meta 决定合批范围。"
author="CozyVale"
version="1.1.0"
script="plugin.gd"
